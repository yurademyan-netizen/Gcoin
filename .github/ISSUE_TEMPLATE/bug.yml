name: Баг
description: Повідомити про помилку
title: "bug: "
labels: ["fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: Що сталося
      description: Опис помилки
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Як відтворити
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Очікувана поведінка
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Середовище
      options:
        - local
        - staging
        - prod
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи / скріншоти
      render: shell
